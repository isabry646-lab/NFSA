<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بلاتفورم نظام سلامة الغذاء - العبد للأغذية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            elabd: {
              brown: '#5A2D22',
              dark: '#3E1E16',
              rose: '#F0A39A',
              roseLight: '#FCECE9',
              roseDark: '#D97B70',
              cream: '#F6D5B0',
              bg: '#FDF8F5'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #FDF8F5; color: #3E1E16; }
    .logo-font { font-family: 'Amiri', serif; }
    .tab-btn.active { 
      background-color: #F0A39A; 
      color: #3E1E16; 
      font-weight: 900; 
      border-right: 5px solid #5A2D22;
    }
    .sub-tab-btn.active {
      background-color: #5A2D22;
      color: #F6D5B0;
      font-weight: 800;
    }
    .doc-btn { transition: all 0.2s ease; }
    .doc-btn:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 24px -6px rgba(90, 45, 34, 0.16); 
      border-color: #F0A39A;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #FCECE9; }
    ::-webkit-scrollbar-thumb { background: #5A2D22; border-radius: 4px; }

    .word-viewer-sheet {
      background: #ffffff;
      color: #000000;
      max-width: 210mm;
      margin: 0 auto;
      padding: 36px 44px;
      border: 1px solid #d1d5db;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      line-height: 1.8;
    }
    .word-viewer-sheet table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
    }
    .word-viewer-sheet th, .word-viewer-sheet td {
      border: 1px solid #000000;
      padding: 8px 10px;
      font-size: 14px;
      color: #000000;
    }
    .word-viewer-sheet th {
      background-color: #f3f4f6;
      font-weight: 800;
      text-align: center;
    }
    .word-viewer-sheet p { margin-bottom: 8px; font-size: 15px; }
    .word-viewer-sheet h1, .word-viewer-sheet h2, .word-viewer-sheet h3 {
      font-weight: 900;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #5A2D22;
    }

    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: #ffffff !important; height: auto !important; overflow: visible !important; }
      .no-print { display: none !important; }
      #mainContainer { padding: 0 !important; overflow: visible !important; }
      #fileViewerSection { display: block !important; }
      .word-viewer-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- الهيدر العلوي بألوان براند العبد -->
  <header class="no-print bg-elabd-brown text-white px-5 py-3 flex flex-wrap items-center justify-between gap-3 border-b-4 border-elabd-rose shadow-md shrink-0">
    <div class="flex items-center gap-3.5">
      <div class="w-13 h-13 px-3 py-1.5 rounded-full bg-elabd-rose border-2 border-elabd-cream flex flex-col items-center justify-center shadow-inner leading-none">
        <span class="text-[9px] font-bold text-elabd-brown">للأغذية</span>
        <span class="logo-font text-lg font-black text-elabd-brown -mt-0.5">العَبْد</span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-black text-base md:text-lg text-elabd-cream">بلاتفورم نظام سلامة الغذاء - العبد للأغذية</h1>
          <span class="bg-elabd-rose text-elabd-dark text-[11px] font-black px-2.5 py-0.5 rounded-full">NFSA System</span>
        </div>
        <p id="repoStatusText" class="text-[11px] text-elabd-roseLight/80">منصة وثائق وسجلات سلامة الغذاء</p>
      </div>
    </div>

    <div class="flex items-center gap-2.5">
      <input 
        type="text" 
        id="searchInput" 
        oninput="renderFilesGrid()" 
        placeholder="ابحث باسم أي ملف أو قسم..." 
        class="w-60 md:w-80 bg-elabd-dark text-white placeholder-elabd-cream/60 text-xs rounded-xl px-4 py-2.5 border border-elabd-rose/40 focus:border-elabd-rose focus:outline-none"
      />
      <button onclick="scanRepositoryFiles()" class="bg-elabd-rose hover:bg-elabd-cream text-elabd-dark text-xs font-black px-4 py-2.5 rounded-xl shadow transition">
        🔄 مزامنة الملفات
      </button>
    </div>
  </header>

  <!-- الجسم الرئيسي -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- القائمة الجانبية المنسدلة (Accordion Tree) -->
    <aside class="no-print w-68 md:w-76 bg-white border-l border-elabd-rose/30 flex flex-col shrink-0 shadow-sm">
      <div class="p-3.5 border-b border-elabd-rose/20 bg-elabd-roseLight/40">
        <div class="text-xs font-extrabold text-elabd-brown/80 mb-2">أقسام وفولدرات النظام:</div>
        <button onclick="selectSection('ALL', null)" id="btn-ALL" class="tab-btn active w-full text-right text-xs font-bold px-3.5 py-2.5 rounded-xl transition flex items-center justify-between text-elabd-brown hover:bg-elabd-roseLight">
          <span>🌐 كل الملفات المرفوعة</span>
          <span id="totalFilesBadge" class="bg-elabd-brown text-elabd-cream text-[10px] px-2 py-0.5 rounded-full font-extrabold">0</span>
        </button>
      </div>
      <div id="sidebarFolders" class="flex-1 overflow-y-auto p-2.5 space-y-1.5"></div>
    </aside>

    <!-- منطقة العمل -->
    <main class="flex-1 overflow-y-auto p-5 md:p-6 space-y-6" id="mainContainer">
      
      <div id="loadingBox" class="no-print bg-white rounded-2xl p-12 text-center border border-elabd-rose/40 shadow-sm">
        <div class="w-10 h-10 border-4 border-elabd-rose border-t-elabd-brown rounded-full animate-spin mx-auto mb-3"></div>
        <p class="font-extrabold text-sm text-elabd-brown">جاري قراءة وتنظيم الأقسام والملفات...</p>
      </div>

      <!-- 1. شبكة أزرار الملفات -->
      <div id="filesSection" class="no-print hidden space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white px-4 py-3 rounded-2xl border border-elabd-rose/30 shadow-sm">
          <h2 id="currentFolderTitle" class="text-base md:text-lg font-black text-elabd-brown flex items-center gap-2"></h2>
          <span class="text-xs text-elabd-brown/70 font-bold">اضغط على أي ملف لفتحه وعرضه مباشرة 👇</span>
        </div>
        <div id="filesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <!-- 2. شاشة عرض محتوى الملف المرفوع -->
      <div id="fileViewerSection" class="hidden"></div>

    </main>
  </div>

  <script>
    let GITHUB_OWNER = 'isabry646-lab';
    let GITHUB_REPO = 'NFSA';
    let GITHUB_BRANCH = 'main';

    // هيكل الشجرة الهرمي: { mainFolder: { totalCount, rootFiles: [], subFolders: { subName: [files] } } }
    let treeStructure = {};
    let allFilesList = [];
    let expandedFolders = {}; // تتبع الفولدرات المفتوحة/المنسدلة
    let activeMainFolder = 'ALL';
    let activeSubFolder = null;
    let activeFilePath = '';

    window.onload = function() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('.github.io')) {
        GITHUB_OWNER = host.replace('.github.io', '');
        GITHUB_REPO = pathParts.length > 0 ? pathParts[0] : (GITHUB_OWNER + '.github.io');
      }
      scanRepositoryFiles();
    };

    async function scanRepositoryFiles() {
      document.getElementById('loadingBox').classList.remove('hidden');
      document.getElementById('filesSection').classList.add('hidden');
      document.getElementById('fileViewerSection').classList.add('hidden');

      try {
        const repoInfoRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`);
        if (!repoInfoRes.ok) throw new Error('تأكد من اتصال الإنترنت وأن المستودع Public');
        const repoInfo = await repoInfoRes.json();
        GITHUB_BRANCH = repoInfo.default_branch || 'main';

        const treeRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`);
        if (!treeRes.ok) throw new Error('تعذر قراءة قائمة الملفات');
        const treeData = await treeRes.json();

        treeStructure = {};
        allFilesList = [];

        (treeData.tree || []).forEach(item => {
          if (item.type !== 'blob') return;
          const filePath = item.path;
          const fileName = filePath.split('/').pop();
          const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';

          // تجاهل ملفات النظام والملفات المؤقتة .tmp
          if (
            filePath.toLowerCase() === 'index.html' ||
            fileName.toLowerCase() === 'readme.md' ||
            fileName.startsWith('.') ||
            ext === 'tmp'
          ) {
            return;
          }

          const parts = filePath.split('/');
          const mainFolder = parts.length > 1 ? parts[0] : 'ملفات عامة';
          const subFolder = parts.length > 2 ? parts.slice(1, -1).join(' / ') : null;
          const cleanTitle = fileName.replace(/\.[^/.]+$/, '');
          const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURI(filePath)}`;

          const fileObj = {
            path: filePath,
            name: fileName,
            title: cleanTitle,
            mainFolder: mainFolder,
            subFolder: subFolder,
            displayPath: subFolder ? `${mainFolder} / ${subFolder}` : mainFolder,
            ext: ext,
            url: rawUrl
          };

          if (!treeStructure[mainFolder]) {
            treeStructure[mainFolder] = { totalCount: 0, rootFiles: [], subFolders: {} };
          }
          treeStructure[mainFolder].totalCount++;

          if (subFolder) {
            if (!treeStructure[mainFolder].subFolders[subFolder]) {
              treeStructure[mainFolder].subFolders[subFolder] = [];
            }
            treeStructure[mainFolder].subFolders[subFolder].push(fileObj);
          } else {
            treeStructure[mainFolder].rootFiles.push(fileObj);
          }

          allFilesList.push(fileObj);
        });

        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('totalFilesBadge').textContent = allFilesList.length;
        document.getElementById('repoStatusText').textContent = `متصل بـ ${GITHUB_OWNER}/${GITHUB_REPO} • إجمالي الملفات: ${allFilesList.length}`;

        renderSidebar();
        renderFilesGrid();

      } catch (err) {
        document.getElementById('loadingBox').innerHTML = `
          <p class="text-red-700 font-bold text-sm mb-3">⚠️ ${err.message}</p>
          <button onclick="scanRepositoryFiles()" class="bg-elabd-brown text-white text-xs font-bold px-4 py-2 rounded-xl">إعادة المحاولة</button>
        `;
      }
    }

    // رسم القائمة الجانبية بنظام القائمة المنسدلة (Accordion)
    function renderSidebar() {
      const container = document.getElementById('sidebarFolders');
      document.getElementById('btn-ALL').classList.toggle('active', activeMainFolder === 'ALL');

      const mainNames = Object.keys(treeStructure).sort((a, b) => a.localeCompare(b, 'ar', { numeric: true }));

      container.innerHTML = mainNames.map(mainName => {
        const node = treeStructure[mainName];
        const subNames = Object.keys(node.subFolders).sort((a, b) => a.localeCompare(b, 'ar', { numeric: true }));
        const hasSubs = subNames.length > 0;
        const isExpanded = !!expandedFolders[mainName];
        const isMainActive = activeMainFolder === mainName && activeSubFolder === null;

        let subMenuHtml = '';
        if (hasSubs && isExpanded) {
          subMenuHtml = `
            <div class="mr-3 mt-1 pr-2.5 border-r-2 border-elabd-rose space-y-1">
              ${subNames.map(subName => {
                const subCount = node.subFolders[subName].length;
                const isSubActive = activeMainFolder === mainName && activeSubFolder === subName;
                return `
                  <button 
                    onclick="selectSection('${escapeStr(mainName)}', '${escapeStr(subName)}')" 
                    class="sub-tab-btn ${isSubActive ? 'active' : 'text-elabd-brown/85 hover:bg-elabd-roseLight/70'} w-full text-right text-[11.5px] font-bold px-3 py-2 rounded-lg transition flex items-center justify-between"
                  >
                    <span class="truncate">📂 ${subName}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isSubActive ? 'bg-elabd-rose text-elabd-dark font-black' : 'bg-elabd-roseLight text-elabd-brown'}">${subCount}</span>
                  </button>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div>
            <button 
              onclick="handleMainFolderClick('${escapeStr(mainName)}', ${hasSubs})" 
              class="tab-btn ${isMainActive ? 'active' : 'text-elabd-brown hover:bg-elabd-roseLight/60'} w-full text-right text-xs font-extrabold px-3.5 py-3 rounded-xl transition flex items-center justify-between"
            >
              <span class="flex items-center gap-1.5 truncate">
                ${hasSubs ? `<span class="text-[10px] transition-transform duration-200">${isExpanded ? '▼' : '◀'}</span>` : ''}
                <span class="truncate">📁 ${mainName}</span>
              </span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-elabd-brown text-elabd-cream font-extrabold shrink-0">${node.totalCount}</span>
            </button>
            ${subMenuHtml}
          </div>
        `;
      }).join('');
    }

    function escapeStr(str) {
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // عند الضغط على القسم الرئيسي (مثل: المكافحة) يفتح/يغلق القائمة المنسدلة ويعرض ملفاته
    function handleMainFolderClick(mainName, hasSubs) {
      if (hasSubs) {
        if (activeMainFolder === mainName && activeSubFolder === null) {
          expandedFolders[mainName] = !expandedFolders[mainName];
        } else {
          expandedFolders[mainName] = true;
        }
      }
      selectSection(mainName, null);
    }

    function selectSection(mainName, subName) {
      activeMainFolder = mainName;
      activeSubFolder = subName;
      activeFilePath = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('fileViewerSection').classList.add('hidden');
      renderSidebar();
      renderFilesGrid();
    }

    function renderFilesGrid() {
      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const section = document.getElementById('filesSection');
      const grid = document.getElementById('filesGrid');
      const titleEl = document.getElementById('currentFolderTitle');

      section.classList.remove('hidden');

      let filesToShow = [];
      if (activeMainFolder === 'ALL' || query !== '') {
        titleEl.innerHTML = `<span class="bg-elabd-brown text-elabd-cream px-3 py-1 rounded-lg text-xs">كل الأقسام</span> <span>جميع الملفات المرفوعة (${allFilesList.length})</span>`;
        filesToShow = allFilesList.filter(f =>
          query === '' ||
          f.title.toLowerCase().includes(query) ||
          f.displayPath.toLowerCase().includes(query) ||
          f.ext.toLowerCase().includes(query)
        );
      } else if (activeSubFolder) {
        titleEl.innerHTML = `
          <span class="bg-elabd-brown text-elabd-cream px-3 py-1 rounded-lg text-xs">${activeMainFolder}</span>
          <span class="text-elabd-roseDark">⬅</span>
          <span class="bg-elabd-rose text-elabd-dark px-3 py-1 rounded-lg text-xs font-black">${activeSubFolder}</span>
        `;
        filesToShow = (treeStructure[activeMainFolder]?.subFolders[activeSubFolder]) || [];
      } else {
        titleEl.innerHTML = `<span class="bg-elabd-rose text-elabd-dark px-3 py-1 rounded-lg text-xs font-black">قسم</span> <span>${activeMainFolder} (الكل)</span>`;
        filesToShow = allFilesList.filter(f => f.mainFolder === activeMainFolder);
      }

      if (filesToShow.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-10 text-center border border-elabd-rose/40 text-elabd-brown/70 font-bold text-sm">
            لا توجد ملفات مطابقة.
          </div>
        `;
        return;
      }

      grid.innerHTML = filesToShow.map(file => {
        const badge = getFileBadgeStyle(file.ext);
        const isSelected = activeFilePath === file.path ? 'ring-4 ring-elabd-brown bg-elabd-roseLight/50' : 'bg-white';

        return `
          <button onclick="openUploadedFile('${escapeStr(file.path)}')" class="doc-btn ${isSelected} text-right p-5 rounded-2xl border-2 border-elabd-rose/40 shadow-sm flex flex-col justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl ${badge.iconBg} flex items-center justify-center text-2xl shrink-0 border border-elabd-rose/30">
                ${badge.icon}
              </div>
              <div class="min-w-0">
                <span class="inline-block text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${badge.badge} mb-1">
                  ${badge.label}
                </span>
                <h3 class="font-black text-elabd-brown text-sm md:text-base leading-snug break-words">${file.title}</h3>
              </div>
            </div>

            <div class="w-full pt-3 border-t border-elabd-rose/20 flex items-center justify-between text-xs">
              <span class="text-elabd-brown/70 font-bold truncate">📂 ${file.displayPath}</span>
              <span class="bg-elabd-brown text-elabd-cream font-extrabold px-3.5 py-1.5 rounded-xl shrink-0">
                فتح الملف ⬅
              </span>
            </div>
          </button>
        `;
      }).join('');
    }

    function getFileBadgeStyle(ext) {
      if (ext === 'pdf') return { label: 'ملف PDF رسمي', icon: '📕', iconBg: 'bg-red-100 text-red-800', badge: 'bg-red-100 text-red-900' };
      if (ext === 'docx' || ext === 'doc') return { label: 'مستند Word', icon: '📘', iconBg: 'bg-blue-100 text-blue-800', badge: 'bg-blue-100 text-blue-900' };
      if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') return { label: 'جدول Excel', icon: '📊', iconBg: 'bg-emerald-100 text-emerald-800', badge: 'bg-emerald-100 text-emerald-900' };
      if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) return { label: 'صورة / شهادة', icon: '🖼️', iconBg: 'bg-amber-100 text-amber-800', badge: 'bg-amber-100 text-amber-900' };
      return { label: 'وثيقة نصية', icon: '📄', iconBg: 'bg-elabd-roseLight text-elabd-brown', badge: 'bg-elabd-rose/40 text-elabd-dark' };
    }

    async function openUploadedFile(filePath) {
      activeFilePath = filePath;
      renderFilesGrid();

      const file = allFilesList.find(f => f.path === filePath);
      if (!file) return;

      const badge = getFileBadgeStyle(file.ext);
      const viewer = document.getElementById('fileViewerSection');
      viewer.classList.remove('hidden');

      viewer.innerHTML = `
        <article class="bg-white rounded-3xl shadow-xl border-2 border-elabd-rose/50 overflow-hidden">
          <div class="no-print bg-elabd-brown text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b-4 border-elabd-rose">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-elabd-rose text-elabd-dark flex items-center justify-center text-2xl">${badge.icon}</div>
              <div>
                <span class="bg-elabd-cream text-elabd-dark text-xs font-black px-3 py-0.5 rounded-full">${badge.label} • ${file.displayPath}</span>
                <h2 class="text-base md:text-lg font-black text-white mt-0.5">${file.title}</h2>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <a href="${file.url}" target="_blank" download="${file.name}" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition">
                ⬇️ تحميل الملف الأصلي
              </a>
              <button onclick="window.print()" class="bg-elabd-cream hover:bg-white text-elabd-dark text-xs font-black px-4 py-2.5 rounded-xl shadow">
                🖨️ طباعة
              </button>
              <button onclick="document.getElementById('fileViewerSection').classList.add('hidden')" class="bg-elabd-rose/20 hover:bg-red-600 text-white text-xs font-black px-4 py-2.5 rounded-xl">
                إغلاق ✕
              </button>
            </div>
          </div>

          <div id="innerFileContent" class="p-6 md:p-8 bg-elabd-bg print:p-0 print:bg-white">
            <div class="text-center py-12 font-bold text-sm text-elabd-brown">جاري فتح الملف...</div>
          </div>
        </article>
      `;

      viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const contentBox = document.getElementById('innerFileContent');

      try {
        if (file.ext === 'pdf') {
          const pdfRes = await fetch(file.url);
          const pdfBlob = await pdfRes.blob();
          const blobUrl = URL.createObjectURL(new Blob([pdfBlob], { type: 'application/pdf' }));
          contentBox.innerHTML = `
            <iframe src="${blobUrl}" class="w-full h-[82vh] rounded-2xl border-2 border-elabd-brown/20 bg-white shadow"></iframe>
          `;
          return;
        }

        if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(file.ext)) {
          contentBox.innerHTML = `
            <div class="word-viewer-sheet text-center">
              <img src="${file.url}" alt="${file.title}" class="max-w-full h-auto mx-auto rounded-lg" />
            </div>
          `;
          return;
        }

        if (file.ext === 'docx') {
          const res = await fetch(file.url);
          const arrayBuffer = await res.arrayBuffer();
          const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
          contentBox.innerHTML = `<div class="word-viewer-sheet">${result.value}</div>`;
          return;
        }

        if (['xlsx', 'xls', 'csv'].includes(file.ext)) {
          const res = await fetch(file.url);
          const arrayBuffer = await res.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          let sheetsHtml = '';
          workbook.SheetNames.forEach(sheetName => {
            const htmlTable = XLSX.utils.sheet_to_html(workbook.Sheets[sheetName]);
            sheetsHtml += `<h3 class="text-base font-black mb-2 mt-4">📄 ${sheetName}</h3><div class="overflow-x-auto">${htmlTable}</div>`;
          });
          contentBox.innerHTML = `<div class="word-viewer-sheet">${sheetsHtml}</div>`;
          return;
        }

        const textRes = await fetch(file.url);
        const textContent = await textRes.text();
        contentBox.innerHTML = `<div class="word-viewer-sheet whitespace-pre-line font-semibold">${textContent}</div>`;

      } catch (e) {
        contentBox.innerHTML = `
          <div class="text-center py-8">
            <p class="text-red-700 font-bold mb-3">تعذر عرض المعاينة المباشرة لهذا الملف (${e.message})</p>
            <a href="${file.url}" target="_blank" class="bg-elabd-brown text-white text-xs font-bold px-5 py-2.5 rounded-xl">فتح أو تحميل الملف مباشرة ↗</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
