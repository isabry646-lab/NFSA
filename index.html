    function renderDynamicWordSheet(title, rawText) {
      const lines = (rawText || '').split('\n').map(l => l.trim()).filter(Boolean);
      let bodyHtml = '';
      let tableRows = [];

      function flushTable() {
        if (tableRows.length === 0) return;
        const headers = tableRows[0];
        const rows = tableRows.slice(1);
        bodyHtml += `
          <table class="word-table">
            <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody>
              ${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 0 ? 'font-bold bg-gray-50/60' : ''}">${c}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        `;
        tableRows = [];
      }

      lines.forEach((line, idx) => {
        if (idx === 0) return;
        if (line.includes('|')) {
          tableRows.push(line.split('|').map(c => c.trim()));
          return;
        }
        flushTable();
        if (/^[1-9]\d?\s*[\.\-]/.test(line)) {
          bodyHtml += `<h2 class="doc-sec-title">${line}</h2>`;
        } else if (line.startsWith('•') || line.startsWith('-')) {
          bodyHtml += `<ul class="list-disc pr-6 mb-2"><li>${line.replace(/^[•\-]\s*/, '')}</li></ul>`;
        } else {
          bodyHtml += `<p class="mb-2">${line}</p>`;
        }
      });
      flushTable();

      return `<div class="word-doc-sheet"><h1 class="doc-main-title">${title}</h1>${bodyHtml}</div>`;
    }
